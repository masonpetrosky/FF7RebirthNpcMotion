[NpcMotion]
; 1 = fix the motion vectors of characters whose animation was not updated this frame, 0 = the game's own.
Enabled=1
; Virtual-key code that switches the fix on and off (118 = F7, 0 = none).
ToggleKey=118
; Characters the game's animation budget may interpolate on the frames it skips, so their pose moves every frame.
; The game uses 0 (UE's default is 16); -1 leaves the game's value. Applies at startup.
InterpolatedCharacters=64
; 1 = the game's animation budget. 0 = switch it off at startup: every character is fully animated every frame
; (in Kalm that made the game CPU-bound: about 60 instead of 100 fps on an i7-13700KF).
AnimationBudget=1
; 1 = write a line of statistics to ReShade.log every 600 frames.
LogStats=0
