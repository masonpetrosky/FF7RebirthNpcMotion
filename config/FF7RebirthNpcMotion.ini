[NpcMotion]
; 1 = fix the motion vectors of characters whose animation was not updated this frame, 0 = the game's own.
Enabled=1
; Virtual-key code that switches the fix on and off (118 = F7, 0 = none). This key and the ones below work while the
; game's window is in front and neither Alt nor Ctrl is held.
ToggleKey=118
; Characters the game's animation budget may interpolate on the frames it skips, so their pose moves every frame.
; The game uses 0 (UE's default is 16); -1 leaves the game's value. Applies at startup.
InterpolatedCharacters=64
; 1 = the game's animation budget. 0 = switch it off at startup: every character is fully animated every frame
; (in Kalm that made the game CPU-bound: about 60 instead of 100 fps on an i7-13700KF).
AnimationBudget=1
; 1 = write a line of statistics to ReShade.log every 600 frames.
LogStats=0

; DLSS: the game's own integration, checked against NVIDIA's DLSS Programming Guide (see README). The keys and the
; overlay's checkboxes switch these for the session; the values here apply at startup.
; Jitter positions per sequence (r.TemporalAASamples). The game keeps Unreal's 8 at every render scale; NVIDIA's guide
; asks for at least 32 at 50% render scale (Performance mode). 0 = the game's.
JitterPhases=32
; Key that switches between the game's jitter sequence and JitterPhases (116 = F5, 0 = none).
JitterKey=116
; 1 = pass the engine's pre-exposure to DLSS (the game passes 1 although the engine pre-exposes the scene colour).
; 0 together with DlssProbe=0 leaves the game's DLSS calls alone.
DlssPreExposure=1
; Key that switches passing the pre-exposure on and off (115 = F4, 0 = none).
PreExposureKey=115
; Extra texture mip bias on top of the game's log2(render width / output width), -1 in Performance mode; NVIDIA's
; guide asks for -1 more. In game -1 left the median texture detail unchanged and made about a tenth of the textured
; areas a little sharper (see README). 0 = leave the game's code alone. A non-zero value patches the game's bias at startup and enables MipBiasKey and the overlay's
; slider, which saves its value here.
ExtraMipBias=0
; Key that switches the extra mip bias on and off (35 = End; F3 is used by the game).
MipBiasKey=35
; Development: log what the game passes to DLSS to FF7RebirthNpcMotion_dlss.log (F6 logs 120 evaluations).
DlssProbe=0
